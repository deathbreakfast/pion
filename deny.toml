# cargo-deny configuration for Pion.
# See docs/supply-chain.md for Git dependency policy.

[advisories]
version = 2
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no fixed release; temporary until the stack moves off chrono (security:RUSTSEC-2026-0543)" },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys via sqlx, no fixed release yet (security:RUSTSEC-2026-0459)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/unified-field-dev/valence",
    "https://github.com/unified-field-dev/photon",
    "https://github.com/unified-field-dev/Spectra",
    "https://github.com/unified-field-dev/parton",
    "https://github.com/unified-field-dev/quark",
    "https://github.com/unified-field-dev/chronon",
    "https://github.com/unified-field-dev/chronon-coordinator",
    "https://github.com/unified-field-dev/chronon-coordinator-macros",
    "https://github.com/unified-field-dev/chronon-valence-identity",
]
